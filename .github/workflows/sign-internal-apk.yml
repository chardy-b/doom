name: Sign internal APK
run-name: Sign internal APK for ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Android CI run ID containing exact device evidence
        required: true
        type: string
      candidate_sha:
        description: Exact 40-character lowercase commit SHA tested by the source run
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  sign:
    name: Stable internal-test signer
    if: github.ref == 'refs/heads/main'
    environment: internal-signing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the trusted signer from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify trusted workflow ref and source run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          SOURCE_RUN_FILE: ${{ runner.temp }}/source-run.json
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import urllib.request

          run_id = os.environ["SOURCE_RUN_ID"]
          candidate = os.environ["CANDIDATE_SHA"]
          if re.fullmatch(r"[1-9][0-9]*", run_id) is None:
              raise SystemExit("source run ID must be a positive decimal integer")
          if re.fullmatch(r"[0-9a-f]{40}", candidate) is None:
              raise SystemExit("candidate SHA must be 40 lowercase hexadecimal characters")
          request = urllib.request.Request(
              f"https://api.github.com/repos/chardy-b/doom/actions/runs/{run_id}",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "doom-trusted-internal-signer",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              run = json.load(response)
          expected = {
              "repository": "chardy-b/doom",
              "workflow_path": ".github/workflows/android.yml",
              "run_id": run_id,
              "head_sha": candidate,
              "status": "completed",
              "conclusion": "success",
          }
          actual = {
              "repository": run.get("repository", {}).get("full_name"),
              "workflow_path": run.get("path"),
              "run_id": str(run.get("id")),
              "head_sha": run.get("head_sha"),
              "status": run.get("status"),
              "conclusion": run.get("conclusion"),
          }
          if actual != expected:
              raise SystemExit(f"source run identity or result mismatch: {actual!r}")
          if run.get("event") not in {"pull_request", "push", "workflow_dispatch"}:
              raise SystemExit("source run event is not approved")
          attempt = run.get("run_attempt")
          if not isinstance(attempt, int) or attempt < 1:
              raise SystemExit("source run attempt is invalid")
          record = {**actual, "event": run["event"], "run_attempt": attempt, "html_url": run.get("html_url")}
          Path(os.environ["SOURCE_RUN_FILE"]).write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Download exact emulator-tested evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          name: doom-device-evidence-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/doom-device-evidence
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install pinned signing tools
        run: sdkmanager 'build-tools;35.0.0'
      - name: Sign exact tested payload with the protected internal identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_FILE: ${{ runner.temp }}/source-run.json
          DOOM_DEVICE_EVIDENCE_DIR: ${{ runner.temp }}/doom-device-evidence
          DOOM_INTERNAL_OUTPUT_DIR: ${{ runner.temp }}/doom-internal-signed
          DOOM_INTERNAL_SIGNING_KEYSTORE_B64: ${{ secrets.DOOM_INTERNAL_SIGNING_KEYSTORE_B64 }}
          DOOM_INTERNAL_SIGNING_PASSWORD: ${{ secrets.DOOM_INTERNAL_SIGNING_PASSWORD }}
        run: bash scripts/sign-internal-apk.sh
      - name: Upload stable internal-test APK and signing evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: doom-internal-signed-apk-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/doom-internal-signed/
          if-no-files-found: error
          retention-days: 30
